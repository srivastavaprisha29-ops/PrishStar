name: Deploy PrishStar to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prishstar-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRISHSTAR_ADMIN_PASSWORD: ${{ secrets.PRISHSTAR_ADMIN_PASSWORD }}
    steps:
      - name: Check deployment secrets
        id: config
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$PRISHSTAR_ADMIN_PASSWORD" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment not run. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and PRISHSTAR_ADMIN_PASSWORD in repository Settings → Secrets and variables → Actions, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then exit 1; fi
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test owner sessions
        if: steps.config.outputs.ready == 'true'
        run: node --experimental-strip-types --test tests/owner-session.test.mjs
      - name: Prepare database and media storage
        if: steps.config.outputs.ready == 'true'
        run: node scripts/cloudflare-setup.mjs
      - name: Build standalone application
        if: steps.config.outputs.ready == 'true'
        run: pnpm exec vite build --config vite.cloudflare.config.ts
      - name: Apply database migrations
        if: steps.config.outputs.ready == 'true'
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.cloudflare.generated.json
      - name: Deploy and verify live URL
        if: steps.config.outputs.ready == 'true'
        run: node scripts/cloudflare-deploy.mjs
